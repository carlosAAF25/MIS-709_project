version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password_secreta
      POSTGRES_DB: tareas_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d tareas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: api-node
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: admin
      POSTGRES_PASSWORD: password_secreta
      DB_NAME: tareas_db
    ports:
      - "3000:3000"

volumes:
  pgdata: